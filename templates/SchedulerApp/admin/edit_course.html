{% extends "SchedulerApp/base.html" %}

{% block title %}Edit Course - TA Scheduler{% endblock %}

{% block content %}

<div class="lava" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>


<style>
body {
    background:
        radial-gradient(ellipse 70% 45% at 50% 105%, rgba(214, 110, 40, 0.35), transparent 70%),
        linear-gradient(180deg, #121620 0%, #1a1f2b 100%) !important;
    background-attachment: fixed !important;
    min-height: 100vh;
    color: #f1ece3 !important;
}

h2 {
    color: #eba35c;
    font-weight: 700;
}

.neon-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4);
    border-radius: 18px;
    padding: 30px;
    margin-top: 25px;
}

label {
    color: #f1ece3;
    font-weight: 600;
    margin-bottom: 6px;
}

.form-control,
.form-select {
    color-scheme: dark;
    background: #232836;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #f1ece3 !important;
    border-radius: 10px;
    padding: 12px;
}

.form-select option {
    background: #232836;
    color: #f1ece3;
}

.form-control:focus,
.form-select:focus {
    background: #2a3040;
    border-color: #eba35c;
    box-shadow: 0 0 0 3px rgba(235, 163, 92, 0.3);
    color: #fffaf2 !important;
}

.form-control::placeholder {
    color: rgba(241, 236, 227, 0.5) !important;
    opacity: 1 !important;
}

.invalid-feedback {
    color: #f0a39b;
}

.form-control[readonly] {
    background: #1e2330;
    color: #b9b2a6 !important;
}

.btn-save {
    background: linear-gradient(180deg, #dc8b3e, #bf6d27);
    border: none;
    color: white;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 0 #9a5418, 0 8px 16px rgba(0, 0, 0, 0.3);
    transition: 0.25s;
}
.btn-save:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #9a5418, 0 12px 20px rgba(0, 0, 0, 0.35);
}

.btn-cancel {
    background: rgba(255, 255, 255, 0.10);
    border: none;
    color: #f1ece3;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 12px;
    transition: 0.2s;
}
.btn-cancel:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    transform: translateY(-2px);
}

.alert-danger {
    background: rgba(240, 163, 155, 0.14);
    border: none;
    border-left: 4px solid #b8544b;
    color: #f0a39b;
    border-radius: 8px;
    margin-bottom: 20px;
}

    /* ===== Lava lamp background (sits behind everything, incl. navbar) ===== */
    .lava {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .blob {
        position: absolute;
        bottom: -30vh;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f5a55a 0%, #e0772b 45%, #b8531c 100%);
        filter: blur(6px);
        opacity: 0.85;
        animation:
            rise var(--dur) ease-in-out var(--delay) infinite alternate,
            morph calc(var(--dur) / 2.5) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes rise {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(var(--drift), -70vh) scale(1.1); }
        100% { transform: translate(0, -135vh) scale(0.95); }
    }

    @keyframes morph {
        0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
        33%  { border-radius: 42% 58% 55% 45% / 60% 44% 56% 40%; }
        66%  { border-radius: 58% 42% 40% 60% / 45% 58% 42% 55%; }
        100% { border-radius: 47% 53% 60% 40% / 55% 40% 60% 45%; }
    }

    .blob:nth-child(1) { left: 6%;  width: 260px; height: 260px; --dur: 26s; --delay: -4s;  --drift: 40px; }
    .blob:nth-child(2) { left: 30%; width: 180px; height: 200px; --dur: 21s; --delay: -14s; --drift: -30px; }
    .blob:nth-child(3) { left: 58%; width: 320px; height: 300px; --dur: 32s; --delay: -9s;  --drift: 25px; }
    .blob:nth-child(4) { left: 80%; width: 200px; height: 220px; --dur: 24s; --delay: -19s; --drift: -45px; }
    .blob:nth-child(5) { left: 44%; width: 130px; height: 140px; --dur: 18s; --delay: -6s;  --drift: 35px;
                         background: radial-gradient(circle at 35% 30%, #f2c46a 0%, #d99a35 50%, #a8671c 100%); }
    .blob:nth-child(6) { left: 16%; width: 150px; height: 160px; --dur: 23s; --delay: -11s; --drift: -20px;
                         background: radial-gradient(circle at 35% 30%, #f28a5a 0%, #d45a2a 50%, #9e3a16 100%); }
    .blob:nth-child(7) { left: 70%; width: 110px; height: 120px; --dur: 17s; --delay: -2s;  --drift: 20px; }

    @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; bottom: auto; top: calc(var(--delay) * -4vh); }
    }
</style>

<div class="container mt-4">
    <h2>Edit Course</h2>

    {% if error %}
        <div class="alert alert-danger mt-3">
            {{ error }}
        </div>
    {% endif %}

    <div class="neon-card">

        <form method="post">
            {% csrf_token %}

            <!-- Course Code (Read-only) -->
            <div class="mb-3">
                <label class="form-label">Course Code</label>
                <input type="text"
                       class="form-control"
                       name="code"
                       value="{{ code }}"
                       readonly>
            </div>

            <!-- Course Name -->
            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text"
                       class="form-control"
                       name="name"
                       value="{{ name }}">
            </div>

            <!-- Section -->
            <div class="mb-3">
                <label class="form-label">Section</label>
                <input type="text"
                       class="form-control"
                       name="section"
                       value="{{ section }}">
            </div>

            <!-- Instructor Email -->
            <div class="mb-3">
                <label class="form-label">Instructor Email</label>
                <input type="email"
                       class="form-control"
                       name="instructor_email"
                       value="{{ instructor_email }}">
            </div>

            <div class="d-flex gap-3 mt-4">
                <button type="submit" class="btn-save">Save Changes</button>
                <a href="/admin/courses/" class="btn-cancel">Cancel</a>
            </div>

        </form>

    </div>
</div>

{% endblock %}
