{% extends "SchedulerApp/base.html" %}

{% block title %}Admin Dashboard{% endblock %}

{% block content %}

<div class="lava" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>


<style>
body {
    background:
        radial-gradient(ellipse 70% 45% at 50% 105%, rgba(214, 110, 40, 0.35), transparent 70%),
        linear-gradient(180deg, #121620 0%, #1a1f2b 100%) !important;
    background-attachment: fixed !important;
    min-height: 100vh;
    color: #f1ece3 !important;
}

.dashboard-header {
    background: linear-gradient(135deg, rgba(235, 163, 92, 0.20), rgba(230, 197, 106, 0.07));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    padding: 40px;
    border-radius: 20px;
    color: #eba35c;
    text-align: center;
    margin-bottom: 50px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4);
    font-size: 36px;
    font-weight: 700;
}

.action-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4);
    border-radius: 20px;
    padding: 30px;
    text-align: center;
    transition: 0.3s ease-in-out;
}

.action-card:hover {
    transform: translateY(-8px);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4), 0 26px 56px rgba(0, 0, 0, 0.45);
}

.action-card h3 {
    color: #f1ece3;
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 15px;
}

.action-card p {
    color: #b9b2a6;
    font-size: 16px;
}

.action-btn {
    margin-top: 25px;
    padding: 15px;
    font-size: 20px;
    font-weight: 600;
    border-radius: 12px;
    width: 100%;
    color: white;
    border: none;
    transition: 0.25s;
}

.btn-staff { background: #c77d2e; box-shadow: 0 4px 0 #9a5418, 0 8px 16px rgba(0, 0, 0, 0.3); }
.btn-staff:hover { background: #d58b3b; box-shadow: 0 6px 0 #9a5418, 0 12px 20px rgba(0, 0, 0, 0.35); transform: translateY(-2px); }

.btn-course { background: #5b8a4a; box-shadow: 0 4px 0 #43693a, 0 8px 16px rgba(0, 0, 0, 0.3); }
.btn-course:hover { background: #689857; box-shadow: 0 6px 0 #43693a, 0 12px 20px rgba(0, 0, 0, 0.35); transform: translateY(-2px); }

.btn-oh { background: #4d8580; box-shadow: 0 4px 0 #35625e, 0 8px 16px rgba(0, 0, 0, 0.3); }
.btn-oh:hover { background: #5a938e; box-shadow: 0 6px 0 #35625e, 0 12px 20px rgba(0, 0, 0, 0.35); transform: translateY(-2px); }

    /* ===== Lava lamp background (sits behind everything, incl. navbar) ===== */
    .lava {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .blob {
        position: absolute;
        bottom: -30vh;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f5a55a 0%, #e0772b 45%, #b8531c 100%);
        filter: blur(6px);
        opacity: 0.85;
        animation:
            rise var(--dur) ease-in-out var(--delay) infinite alternate,
            morph calc(var(--dur) / 2.5) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes rise {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(var(--drift), -70vh) scale(1.1); }
        100% { transform: translate(0, -135vh) scale(0.95); }
    }

    @keyframes morph {
        0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
        33%  { border-radius: 42% 58% 55% 45% / 60% 44% 56% 40%; }
        66%  { border-radius: 58% 42% 40% 60% / 45% 58% 42% 55%; }
        100% { border-radius: 47% 53% 60% 40% / 55% 40% 60% 45%; }
    }

    .blob:nth-child(1) { left: 6%;  width: 260px; height: 260px; --dur: 26s; --delay: -4s;  --drift: 40px; }
    .blob:nth-child(2) { left: 30%; width: 180px; height: 200px; --dur: 21s; --delay: -14s; --drift: -30px; }
    .blob:nth-child(3) { left: 58%; width: 320px; height: 300px; --dur: 32s; --delay: -9s;  --drift: 25px; }
    .blob:nth-child(4) { left: 80%; width: 200px; height: 220px; --dur: 24s; --delay: -19s; --drift: -45px; }
    .blob:nth-child(5) { left: 44%; width: 130px; height: 140px; --dur: 18s; --delay: -6s;  --drift: 35px;
                         background: radial-gradient(circle at 35% 30%, #f2c46a 0%, #d99a35 50%, #a8671c 100%); }
    .blob:nth-child(6) { left: 16%; width: 150px; height: 160px; --dur: 23s; --delay: -11s; --drift: -20px;
                         background: radial-gradient(circle at 35% 30%, #f28a5a 0%, #d45a2a 50%, #9e3a16 100%); }
    .blob:nth-child(7) { left: 70%; width: 110px; height: 120px; --dur: 17s; --delay: -2s;  --drift: 20px; }

    @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; bottom: auto; top: calc(var(--delay) * -4vh); }
    }
</style>


<div class="dashboard-header" style="text-align: left;">
    Welcome, {{ user.first_name }}
</div>



<div class="row justify-content-center g-5">

    <!-- Manage Staff -->
    <div class="col-md-4">
        <div class="action-card">
            <h3>Manage Staff</h3>
            <a href="/admin/staff/">
                <button class="action-btn btn-staff">Open</button>
            </a>
        </div>
    </div>

    <!-- Manage Courses -->
    <div class="col-md-4">
        <div class="action-card">
            <h3>Manage Courses</h3>
            <a href="/admin/courses/">
                <button class="action-btn btn-course">Manage</button>
            </a>
        </div>
    </div>

    <!-- Office Hours -->
    <div class="col-md-4">
        <div class="action-card">
            <h3>Office Hours</h3>
            <a href="/admin/office_hours/">
                <button class="action-btn btn-oh">View</button>
            </a>
        </div>
    </div>

</div>


{% endblock %}
