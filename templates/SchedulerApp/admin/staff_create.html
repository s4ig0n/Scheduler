{% extends "SchedulerApp/base.html" %}

{% block title %}Create Staff Account{% endblock %}

{% block content %}

<div class="lava" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>


<style>
body {
    background:
        radial-gradient(ellipse 70% 45% at 50% 105%, rgba(214, 110, 40, 0.35), transparent 70%),
        linear-gradient(180deg, #121620 0%, #1a1f2b 100%) !important;
    background-attachment: fixed !important;
    min-height: 100vh;
    color: #f1ece3 !important;
}

h2 {
    color: #eba35c;
    font-weight: 700;
    margin-bottom: 25px;
}

.neon-card {
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
    backdrop-filter: blur(22px) saturate(180%);
    -webkit-backdrop-filter: blur(22px) saturate(180%);
    border: 1px solid rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35), 0 20px 50px rgba(0, 0, 0, 0.4);
    border-radius: 18px;
    padding: 30px;
    margin-bottom: 50px;
}

label {
    color: #f1ece3;
    font-weight: 600;
    margin-bottom: 6px;
}

.form-control,
.form-select {
    color-scheme: dark;
    background: #232836;
    border: 1px solid rgba(255, 255, 255, 0.18);
    color: #f1ece3 !important;
    border-radius: 10px;
    padding: 12px;
}

.form-select option {
    background: #232836;
    color: #f1ece3;
}

.form-control:focus,
.form-select:focus {
    background: #2a3040;
    border-color: #eba35c;
    box-shadow: 0 0 0 3px rgba(235, 163, 92, 0.3);
    color: #fffaf2 !important;
}

.form-control::placeholder {
    color: rgba(241, 236, 227, 0.5) !important;
    opacity: 1 !important;
}

.invalid-feedback {
    color: #f0a39b;
}

.alert-success,
.alert-info {
    background: rgba(163, 201, 143, 0.14);
    border-left: 4px solid #5b8a4a;
    color: #a3c98f;
    font-size: 1rem;
    border-radius: 8px;
}

.btn-create {
    background: linear-gradient(180deg, #dc8b3e, #bf6d27);
    border: none;
    color: white;
    font-weight: 600;
    padding: 12px 24px;
    border-radius: 12px;
    box-shadow: 0 4px 0 #9a5418, 0 8px 16px rgba(0, 0, 0, 0.3);
    transition: 0.25s;
}
.btn-create:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #9a5418, 0 12px 20px rgba(0, 0, 0, 0.35);
}

.btn-cancel {
    background: rgba(255, 255, 255, 0.10);
    border: none;
    color: #f1ece3;
    font-weight: 600;
    text-decoration: none;
    padding: 12px 24px;
    border-radius: 12px;
    transition: 0.2s;
}
.btn-cancel:hover {
    background: rgba(255, 255, 255, 0.18);
    color: #ffffff;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.3);
    transform: translateY(-2px);
}

    /* ===== Lava lamp background (sits behind everything, incl. navbar) ===== */
    .lava {
        position: fixed;
        inset: 0;
        overflow: hidden;
        z-index: -1;
        pointer-events: none;
    }

    .blob {
        position: absolute;
        bottom: -30vh;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #f5a55a 0%, #e0772b 45%, #b8531c 100%);
        filter: blur(6px);
        opacity: 0.85;
        animation:
            rise var(--dur) ease-in-out var(--delay) infinite alternate,
            morph calc(var(--dur) / 2.5) ease-in-out var(--delay) infinite alternate;
    }

    @keyframes rise {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(var(--drift), -70vh) scale(1.1); }
        100% { transform: translate(0, -135vh) scale(0.95); }
    }

    @keyframes morph {
        0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
        33%  { border-radius: 42% 58% 55% 45% / 60% 44% 56% 40%; }
        66%  { border-radius: 58% 42% 40% 60% / 45% 58% 42% 55%; }
        100% { border-radius: 47% 53% 60% 40% / 55% 40% 60% 45%; }
    }

    .blob:nth-child(1) { left: 6%;  width: 260px; height: 260px; --dur: 26s; --delay: -4s;  --drift: 40px; }
    .blob:nth-child(2) { left: 30%; width: 180px; height: 200px; --dur: 21s; --delay: -14s; --drift: -30px; }
    .blob:nth-child(3) { left: 58%; width: 320px; height: 300px; --dur: 32s; --delay: -9s;  --drift: 25px; }
    .blob:nth-child(4) { left: 80%; width: 200px; height: 220px; --dur: 24s; --delay: -19s; --drift: -45px; }
    .blob:nth-child(5) { left: 44%; width: 130px; height: 140px; --dur: 18s; --delay: -6s;  --drift: 35px;
                         background: radial-gradient(circle at 35% 30%, #f2c46a 0%, #d99a35 50%, #a8671c 100%); }
    .blob:nth-child(6) { left: 16%; width: 150px; height: 160px; --dur: 23s; --delay: -11s; --drift: -20px;
                         background: radial-gradient(circle at 35% 30%, #f28a5a 0%, #d45a2a 50%, #9e3a16 100%); }
    .blob:nth-child(7) { left: 70%; width: 110px; height: 120px; --dur: 17s; --delay: -2s;  --drift: 20px; }

    @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; bottom: auto; top: calc(var(--delay) * -4vh); }
    }
</style>

<div class="container mt-4">

    <h2>Create Staff Account</h2>

    {% if success %}
    <div class="alert-success mb-4 p-3" style="
        background: rgba(163, 201, 143, 0.14);
        border-left: 4px solid #5b8a4a;
        color: #a3c98f;
        font-size: 1.1rem;
        border-radius: 10px;
    ">
        {{ success }}
    </div>
    {% endif %}


    <div class="neon-card">

        <form method="POST">
            {% csrf_token %}

            <!-- First Name -->
            <div class="mb-3">
                <label class="form-label">First Name</label>
                <input type="text" name="first_name" class="form-control" required>
            </div>

            <!-- Last Name -->
            <div class="mb-3">
                <label class="form-label">Last Name</label>
                <input type="text" name="last_name" class="form-control" required>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email"
                       name="email"
                       class="form-control {% if email_error %}is-invalid{% endif %}"
                       value="{{ email }}"
                       required>
                {% if email_error %}
                    <div class="invalid-feedback d-block">
                        {{ email_error }}
                    </div>
                {% endif %}
            </div>

            <!-- Role -->
            <div class="mb-3">
                <label class="form-label">Role</label>
                <select name="role" class="form-select" required>
                    <option value="" disabled selected>Select role</option>
                    <option value="Instructor">Instructor</option>
                    <option value="TA">TA</option>
                </select>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <!-- Buttons -->
            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn-create">Create Account</button>
                <a href="/admin/staff" class="btn-cancel">Cancel</a>
            </div>

        </form>

    </div>

</div>

{% endblock %}
