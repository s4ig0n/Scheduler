{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            /* dark blue-grey lamp, with warm "heat" glowing up from the bottom */
            background:
                radial-gradient(ellipse 70% 45% at 50% 105%, rgba(214, 110, 40, 0.35), transparent 70%),
                linear-gradient(180deg, #121620 0%, #1a1f2b 100%);
            background-attachment: fixed;

            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            font-family: "Inter", sans-serif;
        }

        /* ================= LAVA LAMP BACKGROUND ================= */
        .lava {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .blob {
            position: absolute;
            bottom: -30vh;
            border-radius: 50%;
            background: radial-gradient(circle at 35% 30%, #f5a55a 0%, #e0772b 45%, #b8531c 100%);
            filter: blur(6px);
            opacity: 0.9;
            animation:
                rise var(--dur) ease-in-out var(--delay) infinite alternate,
                morph calc(var(--dur) / 2.5) ease-in-out var(--delay) infinite alternate;
        }

        /* Rise to the top, then sink back down, like wax in a lamp */
        @keyframes rise {
            0%   { transform: translate(0, 0) scale(1); }
            50%  { transform: translate(var(--drift), -70vh) scale(1.1); }
            100% { transform: translate(0, -135vh) scale(0.95); }
        }

        /* Wobbly, stretching shape */
        @keyframes morph {
            0%   { border-radius: 50% 50% 50% 50% / 50% 50% 50% 50%; }
            33%  { border-radius: 42% 58% 55% 45% / 60% 44% 56% 40%; }
            66%  { border-radius: 58% 42% 40% 60% / 45% 58% 42% 55%; }
            100% { border-radius: 47% 53% 60% 40% / 55% 40% 60% 45%; }
        }

        .blob:nth-child(1) { left: 6%;  width: 260px; height: 260px; --dur: 26s; --delay: -4s;  --drift: 40px; }
        .blob:nth-child(2) { left: 30%; width: 180px; height: 200px; --dur: 21s; --delay: -14s; --drift: -30px; }
        .blob:nth-child(3) { left: 58%; width: 320px; height: 300px; --dur: 32s; --delay: -9s;  --drift: 25px; }
        .blob:nth-child(4) { left: 80%; width: 200px; height: 220px; --dur: 24s; --delay: -19s; --drift: -45px; }
        .blob:nth-child(5) { left: 44%; width: 130px; height: 140px; --dur: 18s; --delay: -6s;  --drift: 35px;
                             background: radial-gradient(circle at 35% 30%, #f2c46a 0%, #d99a35 50%, #a8671c 100%); }
        .blob:nth-child(6) { left: 16%; width: 150px; height: 160px; --dur: 23s; --delay: -11s; --drift: -20px;
                             background: radial-gradient(circle at 35% 30%, #f28a5a 0%, #d45a2a 50%, #9e3a16 100%); }
        .blob:nth-child(7) { left: 70%; width: 110px; height: 120px; --dur: 17s; --delay: -2s;  --drift: 20px; }

        @media (prefers-reduced-motion: reduce) {
            .blob { animation: none; bottom: auto; top: calc(var(--delay) * -4vh); }
        }

        /* ================= HEADER / LOGO ================= */
        .login-header {
            position: relative;
            z-index: 1;
            margin-top: 140px;
            text-align: center;
        }

        .login-logo {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: -1px;
            color: #f0a55c;
            line-height: 1;
        }

        .login-logo-dot {
            color: #a3c98f;
        }

        /* ================= LOGIN CARD (liquid glass) ================= */
        .login-card {
            position: relative;
            z-index: 1;
            margin-top: 28px;

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.14), rgba(255, 255, 255, 0.04));
            backdrop-filter: blur(22px) saturate(180%);
            -webkit-backdrop-filter: blur(22px) saturate(180%);

            border-radius: 20px;
            padding: 44px 46px 52px;
            width: 420px;

            border: 1px solid rgba(255, 255, 255, 0.22);

            box-shadow:
                inset 0 1px 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 rgba(255, 255, 255, 0.06),
                0 20px 50px rgba(0, 0, 0, 0.45);
        }

        /* Shield notch */
        .login-card::after {
            content: "";
            position: absolute;
            bottom: -18px;
            left: 50%;
            transform: translateX(-50%);

            width: 0;
            height: 0;

            border-left: 28px solid transparent;
            border-right: 28px solid transparent;
            border-top: 20px solid rgba(255, 255, 255, 0.14);

            filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.3));
        }

        /* ================= TITLE ================= */
        .login-title {
            color: #fffaf2;
            text-align: center;
            margin-bottom: 22px;
            font-size: 34px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* ================= FORM ================= */
        label {
            color: #f1ece3;
            font-weight: 500;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fffaf2;
            border-radius: 10px;
            padding: 10px 14px;
        }

        .form-control:focus {
            border-color: #f0a55c;
            box-shadow: 0 0 0 3px rgba(240, 165, 92, 0.3);
            background: rgba(255, 255, 255, 0.16);
            color: #fffaf2;
        }

        ::placeholder {
            color: rgba(255, 250, 242, 0.55) !important;
            opacity: 1;
        }

        /* ================= BUTTON ================= */
        .neon-login-btn {
            background: linear-gradient(180deg, #dc8b3e, #bf6d27);
            color: white;
            font-weight: 600;
            padding: 12px;
            width: 100%;
            border-radius: 14px;
            border: none;

            box-shadow:
                0 4px 0 #9a5418,
                0 8px 16px rgba(0, 0, 0, 0.3);

            transition: all 0.25s ease-in-out;
        }

        .neon-login-btn:hover {
            transform: translateY(-2px);
            box-shadow:
                0 6px 0 #9a5418,
                0 12px 20px rgba(0, 0, 0, 0.35);
        }

        /* ================= ERROR ================= */
        .alert-danger {
            background: rgba(240, 120, 110, 0.16);
            border: 1px solid rgba(240, 163, 155, 0.45);
            color: #ffd2cc;

            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 500;

            box-shadow: none;
        }
    </style>
</head>

<body>

<div class="lava" aria-hidden="true">
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
    <div class="blob"></div>
</div>

<div class="login-header">
    <div class="login-logo">Scheduler<span class="login-logo-dot">.</span></div>
</div>

<div class="login-card">

    <h2 class="login-title">Login</h2>

    {% if error %}
        <div class="alert alert-danger text-center mb-3">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" action="" autocomplete="off">
        {% csrf_token %}

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              placeholder="you@uwm.edu"
              required
            >
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input
              type="password"
              class="form-control"
              id="password"
              name="password"
              placeholder="Enter your password"
              required
            >
        </div>

        <button type="submit" class="neon-login-btn">
            Log In
        </button>
    </form>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
